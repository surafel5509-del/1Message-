name: Build APK

on:
  push:
    branches:
      - arena/406fec51-1message
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble debug + release
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate and update the preinstalled Android SDK
        run: |
          set -euo pipefail
          mkdir -p build-logs
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}" | tee build-logs/sdk.log
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}" | tee -a build-logs/sdk.log
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/Android/Sdk}}"
          echo "SDK_ROOT=$SDK_ROOT" | tee -a build-logs/sdk.log
          ls -1 "$SDK_ROOT" | tee -a build-logs/sdk.log || true
          SDKMANAGER=""
          for candidate in \
            "$(command -v sdkmanager || true)" \
            "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "$SDK_ROOT/cmdline-tools/bin/sdkmanager" \
            "$SDK_ROOT/tools/bin/sdkmanager"; do
            if [ -n "$candidate" ] && [ -x "$candidate" ]; then SDKMANAGER="$candidate"; break; fi
          done
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found; listing SDK root above"
            exit 1
          fi
          echo "SDKMANAGER=$SDKMANAGER" | tee -a build-logs/sdk.log
          yes | "$SDKMANAGER" --licenses >> build-logs/sdk.log 2>&1 || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" >> build-logs/sdk.log 2>&1
          echo "sdk.dir=$SDK_ROOT" > local.properties
          cat local.properties

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-read-only: false

      - name: Gradle environment
        run: |
          set -o pipefail
          mkdir -p build-logs
          { gradle --version; echo; java -version; echo; env | grep -i -E 'android|java|gradle' || true; } 2>&1 | tee build-logs/version.log

      - name: Compile debug Kotlin
        run: |
          set -o pipefail
          gradle :app:compileDebugKotlin --stacktrace --no-daemon 2>&1 | tee build-logs/compile.log

      - name: Unit tests
        if: always()
        run: |
          set -o pipefail
          gradle :app:testDebugUnitTest --stacktrace --no-daemon 2>&1 | tee build-logs/unit-tests.log

      - name: Assemble debug APK
        if: always()
        run: |
          set -o pipefail
          gradle :app:assembleDebug --stacktrace --no-daemon 2>&1 | tee build-logs/assemble-debug.log

      - name: Assemble release APK (debug-keystore signed evaluation build)
        if: always()
        run: |
          set -o pipefail
          gradle :app:assembleRelease --stacktrace --no-daemon 2>&1 | tee build-logs/assemble-release.log

      - name: Publish errors to the diagnostics issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: '1'
        run: |
          set -o pipefail
          {
            echo "### Run $GITHUB_RUN_ID ($GITHUB_SHA) failed"
            echo
            for f in build-logs/compile.log build-logs/unit-tests.log build-logs/assemble-debug.log build-logs/sdk.log; do
              [ -f "$f" ] || continue
              echo "#### $f"
              echo '```'
              grep -E "^(e: |w: .*error|error:|FAILURE:|\* What went wrong|Execution failed|Caused by|> )" "$f" | head -150 || true
              echo '```'
            done
          } > /tmp/report.md
          wc -l /tmp/report.md
          gh issue comment "$ISSUE_NUMBER" --body-file /tmp/report.md

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build-logs/**
          if-no-files-found: warn

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 1messages-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload release APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 1messages-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
