name: Build APK

on:
  push:
    branches:
      - arena/406fec51-1message
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble debug + release
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate and update the preinstalled Android SDK
        run: |
          set -euo pipefail
          mkdir -p build-logs
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}" | tee build-logs/sdk.log
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}" | tee -a build-logs/sdk.log
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/Android/Sdk}}"
          echo "SDK_ROOT=$SDK_ROOT" | tee -a build-logs/sdk.log
          ls -1 "$SDK_ROOT" | tee -a build-logs/sdk.log || true
          SDKMANAGER=""
          for candidate in \
            "$(command -v sdkmanager || true)" \
            "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "$SDK_ROOT/cmdline-tools/bin/sdkmanager" \
            "$SDK_ROOT/tools/bin/sdkmanager"; do
            if [ -n "$candidate" ] && [ -x "$candidate" ]; then SDKMANAGER="$candidate"; break; fi
          done
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found; listing SDK root above"
            exit 1
          fi
          echo "SDKMANAGER=$SDKMANAGER" | tee -a build-logs/sdk.log
          yes | "$SDKMANAGER" --licenses >> build-logs/sdk.log 2>&1 || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" >> build-logs/sdk.log 2>&1
          echo "sdk.dir=$SDK_ROOT" > local.properties
          cat local.properties

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-read-only: false

      - name: Validate resources with aapt2 (diagnostics)
        continue-on-error: true
        run: |
          set -o pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/Android/Sdk}}"
          AAPT2="$SDK_ROOT/build-tools/35.0.0/aapt2"
          mkdir -p /tmp/aapt2-out build-logs
          "$AAPT2" version | tee build-logs/aapt2.log
          "$AAPT2" compile --dir app/src/main/res -o /tmp/aapt2-out >> build-logs/aapt2.log 2>&1 || true
          tail -40 build-logs/aapt2.log

      - name: Gradle environment
        run: |
          set -o pipefail
          mkdir -p build-logs
          { gradle --version; echo; java -version; echo; env | grep -i -E 'android|java|gradle' || true; } 2>&1 | tee build-logs/version.log

      - name: Compile debug Kotlin
        run: |
          set -o pipefail
          gradle :app:compileDebugKotlin --stacktrace --no-daemon 2>&1 | tee build-logs/compile.log

      - name: Unit tests
        if: always()
        run: |
          set -o pipefail
          gradle :app:testDebugUnitTest --stacktrace --no-daemon 2>&1 | tee build-logs/unit-tests.log

      - name: Assemble debug APK
        if: always()
        run: |
          set -o pipefail
          gradle :app:assembleDebug --stacktrace --no-daemon 2>&1 | tee build-logs/assemble-debug.log

      - name: Assemble release APK (debug-keystore signed evaluation build)
        if: always()
        run: |
          set -o pipefail
          gradle :app:assembleRelease --stacktrace --no-daemon 2>&1 | tee build-logs/assemble-release.log

      - name: Publish errors to the diagnostics issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: '1'
        run: |
          set -o pipefail
          {
            echo "### Run $GITHUB_RUN_ID ($GITHUB_SHA) failed"
            echo
            for f in build-logs/aapt2.log build-logs/compile.log build-logs/unit-tests.log build-logs/assemble-debug.log build-logs/sdk.log; do
              [ -f "$f" ] || continue
              echo "#### $f"
              echo '```'
              if [ "$f" = "build-logs/unit-tests.log" ]; then
                grep -E "FAILED|Test > |expected|actual|AssertionError|java\.lang|There were failing tests|^[0-9]+ tests? completed" "$f" | head -120 || true
              else
                grep -E "^(e: |w: .*error|error:|ERROR|FAILURE:|\* What went wrong|Execution failed|Caused by|> )" "$f" | head -160 || true
              fi
              echo '```'
            done
          } > /tmp/report.md
          wc -l /tmp/report.md
          gh issue comment "$ISSUE_NUMBER" --body-file /tmp/report.md

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build-logs/**
          if-no-files-found: warn

      - name: Assert the APK has no INTERNET permission
        if: success()
        run: |
          set -o pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/Android/Sdk}}"
          AAPT2="$SDK_ROOT/build-tools/35.0.0/aapt2"
          for apk in app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*.apk; do
            [ -f "$apk" ] || continue
            perms=$("$AAPT2" dump permissions "$apk")
            echo "$perms"
            if echo "$perms" | grep -q "android.permission.INTERNET"; then
              echo "::error::$apk declares INTERNET, which breaks the privacy guarantee"
              exit 1
            fi
          done
          echo "No INTERNET permission in any built APK."

      - name: Describe the built APKs
        if: success()
        run: |
          set -o pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/Android/Sdk}}"
          AAPT2="$SDK_ROOT/build-tools/35.0.0/aapt2"
          {
            echo "Automatically built from commit $GITHUB_SHA by [workflow run $GITHUB_RUN_ID]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)."
            echo
            echo "* \`app-debug.apk\` - debug variant, application id \`com.onemessages.app.debug\`, no minification."
            echo "* \`app-release.apk\` - minified release variant, **signed with the repository debug keystore** for evaluation only. Replace the signing config before shipping."
            echo
            echo "### APK contents (aapt2 dump badging)"
            echo
            echo '```'
            for apk in app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*.apk; do
              [ -f "$apk" ] || continue
              echo "== $(basename "$apk") ($(du -h "$apk" | cut -f1))"
              "$AAPT2" dump badging "$apk" 2>/dev/null | grep -E "^(package|sdkVersion|targetSdkVersion|application-label|launchable-activity|uses-permission)" | head -25 || echo "aapt2 dump unavailable"
              echo
            done
            echo '```'
            echo
            echo "Unit tests: see the workflow run. Device behaviour is not tested by CI."
          } > release-notes.md
          cat release-notes.md

      - name: Publish APKs as a release
        if: success() && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: 1Messages APKs (build ${{ github.run_number }})
          prerelease: true
          body_path: release-notes.md
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          fail_on_unmatched_files: false

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 1messages-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload release APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 1messages-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
